name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 for `node --test` + TypeScript type-stripping (frontend, lit).
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Python 3.11 for the stdlib-only worker test suites.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Foundry for the Solidity contract tests.
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Runs every package suite: contracts, ai-market-generator, cartesi,
      # relayer, resolver, archiver, frontend, inference, lit (103 tests).
      # No install step needed — every suite runs on the stdlib / Foundry alone.
      - name: Run full test suite
        run: npm test
