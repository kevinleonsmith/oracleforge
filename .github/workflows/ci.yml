name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 for `node --test` + TypeScript type-stripping (frontend, lit).
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Python 3.11 for the stdlib-only worker test suites.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Foundry for the Solidity contract tests.
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Only third-party test dep: PyYAML, for the inference SDL round-trip test
      # (the test skips cleanly without it; installed here so it actually runs).
      - name: Install PyYAML
        run: pip install pyyaml

      # Runs every package suite: contracts, ai-market-generator, cartesi,
      # relayer, resolver, archiver, frontend, inference, lit (103 tests).
      - name: Run full test suite
        run: npm test

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Installs deps and runs `next build`, which compiles the TSX and
      # type-checks the whole frontend — surfacing errors the stdlib test suite
      # (pure logic only) cannot.
      - name: Install dependencies
        run: npm install
      - name: Build (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  devnet:
    name: anvil devnet parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # anvil + forge + cast — boots a real node, deploys the actual contracts,
      # and asserts on-chain payouts equal the Python ports: the binary
      # MarketEngine against settle(), and the ScalarMarketEngine against
      # scalar_settle() across mid-band / clamp / one-sided-void scenarios.
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Devnet settlement parity (binary + scalar engines)
        run: npm run test:devnet
