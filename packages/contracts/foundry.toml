[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"        # Gnosis Chain compatible

[fuzz]
runs = 512                   # property-based settlement tests (MarketEngineFuzz)

[invariant]
runs = 48                    # stateful solvency sequences (MarketEngineInvariant)
depth = 48
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

# Named RPC endpoints used by forge script --rpc-url gnosis / chiado
[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"
chiado = "${CHIADO_RPC_URL}"
