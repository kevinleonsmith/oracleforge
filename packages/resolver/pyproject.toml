[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracleforge-resolver"
version = "0.1.0"
description = "OracleForge resolution watcher — pokes resolve() and archives outcomes"
requires-python = ">=3.10"
# Core (planner, watcher, models, dry-run) is stdlib-only. Live operation adds
# web3 (chain) and requests (Tableland source).
dependencies = []

[project.optional-dependencies]
chain = ["web3>=6.15"]
tableland = ["requests>=2.31"]
dev = []

[project.scripts]
oracleforge-resolver = "oracleforge_resolver.cli:main"

[tool.setuptools]
packages = ["oracleforge_resolver"]
